# Generate the Xcode project with:  brew install xcodegen && xcodegen generate
name: UltimateHoldem
options:
  bundleIdPrefix: com.yourname
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "1"
targets:
  UltimateHoldem:
    type: application
    platform: iOS
    sources:
      - path: UltimateHoldem
      - path: Configuration/Products.storekit
        buildPhase: none
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.yourname.ultimateholdem
        PRODUCT_NAME: UltimateHoldem
        TARGETED_DEVICE_FAMILY: "1"   # iPhone only (runs on iPad in iPhone mode)
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: "Ultimate Poker"
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UIRequiresFullScreen: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPhone: "UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight"
        INFOPLIST_KEY_UIStatusBarHidden: YES
        INFOPLIST_KEY_ITSAppUsesNonExemptEncryption: NO
        INFOPLIST_KEY_LSApplicationCategoryType: "public.app-category.casino-games"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        DEVELOPMENT_TEAM: ""   # set your Apple Developer Team ID here or in Xcode > Signing
        CODE_SIGN_STYLE: Automatic
  UltimateHoldemTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: UltimateHoldemTests
    dependencies:
      - target: UltimateHoldem
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
schemes:
  UltimateHoldem:
    build:
      targets:
        UltimateHoldem: all
        UltimateHoldemTests: [test]
    run:
      config: Debug
      storeKitConfiguration: Configuration/Products.storekit
    test:
      config: Debug
      targets:
        - UltimateHoldemTests
